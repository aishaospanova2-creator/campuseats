<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusEats — Панель кассы и кухни</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-16">

    <!-- Навигационная панель -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-orange-500 text-white p-2 rounded-lg font-bold text-lg">🔔</div>
                <h1 class="text-xl font-bold">Панель кассы и кухни</h1>
            </div>
            <div class="flex space-x-4">
                <a href="/" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition">На сайт ↗</a>
                <a href="/admin" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition">Админка ↗</a>
            </div>
        </div>
    </header>

    <!-- Основная канбан-доска -->
    <main class="max-w-7xl mx-auto px-6 mt-8 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Колонка 1: Готовятся -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 flex flex-col h-[75vh]">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100">
                <h2 class="font-bold text-gray-800 flex items-center gap-2">
                    ⏳ Готовятся
                </h2>
                <span id="count-preparing" class="bg-orange-100 text-orange-700 text-xs font-bold px-2.5 py-1 rounded-full">0</span>
            </div>
            <div id="col-preparing" class="space-y-4 overflow-y-auto flex-1 pr-1">
                <p class="text-sm text-gray-400 text-center py-4">Нет активных заказов</p>
            </div>
        </div>

        <!-- Колонка 2: Готовы к выдаче -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 flex flex-col h-[75vh]">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100">
                <h2 class="font-bold text-gray-800 flex items-center gap-2">
                    ✅ Готовы к выдаче
                </h2>
                <span id="count-ready" class="bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-1 rounded-full">0</span>
            </div>
            <div id="col-ready" class="space-y-4 overflow-y-auto flex-1 pr-1">
                <p class="text-sm text-gray-400 text-center py-4">Нет готовых заказов</p>
            </div>
        </div>

        <!-- Колонка 3: Выданные -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 flex flex-col h-[75vh]">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100">
                <h2 class="font-bold text-gray-800 flex items-center gap-2">
                    🎉 Выданные
                </h2>
                <span id="count-completed" class="bg-green-100 text-green-700 text-xs font-bold px-2.5 py-1 rounded-full">0</span>
            </div>
            <div id="col-completed" class="space-y-4 overflow-y-auto flex-1 pr-1">
                <p class="text-sm text-gray-400 text-center py-4">Нет выданных заказов</p>
            </div>
        </div>

    </main>

    <!-- Скрипт загрузки и отображения заказов -->
    <script>
        async function loadOrders() {
            try {
                const response = await fetch('/api/orders');
                const orders = await response.json();
                renderKanban(orders);
            } catch (error) {
                console.error('Ошибка загрузки заказов:', error);
            }
        }

        function renderKanban(orders) {
            const prepCol = document.getElementById('col-preparing');
            const readyCol = document.getElementById('col-ready');
            const compCol = document.getElementById('col-completed');

            prepCol.innerHTML = '';
            readyCol.innerHTML = '';
            compCol.innerHTML = '';

            let prepCount = 0;
            let readyCount = 0;
            let compCount = 0;

            if (orders.length === 0) {
                prepCol.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Нет активных заказов</p>';
                readyCol.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Нет готовых заказов</p>';
                compCol.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Нет выданных заказов</p>';
                
                document.getElementById('count-preparing').innerText = '0';
                document.getElementById('count-ready').innerText = '0';
                document.getElementById('count-completed').innerText = '0';
                return;
            }

            orders.forEach(order => {
                let itemsList = [];
                try {
                    itemsList = JSON.parse(order.items);
                } catch (e) {
                    itemsList = [{ title: order.items, price: order.total_price }];
                }

                const card = document.createElement('div');
                card.className = 'bg-gray-50 border border-gray-200 rounded-xl p-4 shadow-sm hover:shadow transition';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="font-bold text-gray-900">Заказ #${order.id}</span>
                        <span class="text-xs bg-orange-500 text-white px-2 py-0.5 rounded-md font-semibold">${order.total_price} ₸</span>
                    </div>
                    <div class="text-xs text-gray-600 mb-2 space-y-0.5">
                        <p><b>Студент:</b> ${order.student_name || 'Аноним'}</p>
                        <p><b>Группа:</b> ${order.group_id || 'Не указана'}</p>
                        <p><b>Время:</b> ${order.pickup_time || 'Ближайшее'}</p>
                        <p><b>Оплата:</b> ${order.payment_method || 'Наличные'}</p>
                    </div>
                    <div class="border-t border-gray-200 pt-2 mt-2">
                        <p class="text-xs font-bold text-gray-700 mb-1">Состав:</p>
                        <ul class="text-xs text-gray-600 space-y-1">
                            ${itemsList.map(i => `<li>• ${i.title} (${i.price} ₸)</li>`).join('')}
                        </ul>
                    </div>
                `;

                const status = order.status || 'Новый';
                if (status === 'Новый' || status === 'Готовятся') {
                    prepCount++;
                    prepCol.appendChild(card);
                } else if (status === 'Готов к выдаче') {
                    readyCount++;
                    readyCol.appendChild(card);
                } else {
                    compCount++;
                    compCol.appendChild(card);
                }
            });

            document.getElementById('count-preparing').innerText = prepCount;
            document.getElementById('count-ready').innerText = readyCount;
            document.getElementById('count-completed').innerText = compCount;

            if (prepCount === 0) prepCol.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Нет активных заказов</p>';
            if (readyCount === 0) readyCol.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Нет готовых заказов</p>';
            if (compCount === 0) compCol.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Нет выданных заказов</p>';
        }

        // Автообновление каждые 3 секунды
        setInterval(loadOrders, 3000);
        loadOrders();
    </script>
</body>
</html>
