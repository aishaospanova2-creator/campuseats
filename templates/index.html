<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CampusEats — Столовая колледжа</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-16">

    <!-- Шапка сайта -->
    <header class="bg-gray-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🍲</span>
                <h1 class="text-xl font-black tracking-wide text-orange-400">CampusEats</h1>
            </div>
            <div class="flex items-center gap-4 text-sm font-bold">
                <a href="/cashier" class="text-amber-300 hover:underline">Касса ↗</a>
                <a href="/admin" class="text-gray-300 hover:underline">Админка ↗</a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Меню блюд (2 колонки) с разделением по категориям -->
        <div class="lg:col-span-2 space-y-8">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-extrabold text-gray-900">🍽️ Меню столовой</h2>
                <span id="dishes-count" class="text-xs bg-orange-100 text-orange-700 font-bold px-3 py-1 rounded-full">Загрузка...</span>
            </div>

            <!-- Контейнер для категорий меню -->
            <div id="menu-categories-container" class="space-y-8">
                <!-- Блюда распределяются по категориям через JavaScript -->
            </div>
        </div>

        <!-- Боковая панель: Корзина и заказ (1 колонка) -->
        <div class="space-y-6">
            <div class="bg-white rounded-3xl shadow-xl border border-gray-100 p-6 sticky top-24 flex flex-col max-h-[calc(100vh-7rem)]">
                <h2 class="text-lg font-bold text-gray-900 mb-3 flex items-center gap-2 shrink-0">
                    🛒 Ваша корзина
                </h2>

                <!-- Список товаров в корзине с внутренней прокруткой -->
                <div id="cart-items" class="space-y-2 mb-4 overflow-y-auto pr-1 flex-1 min-h-[100px]">
                    <p class="text-gray-400 text-sm text-center py-4">Корзина пуста</p>
                </div>

                <!-- Нижняя часть: Итого и форма заказа -->
                <div class="shrink-0 space-y-4 pt-2 border-t border-gray-100">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600 font-medium">Итого к оплате:</span>
                        <span id="cart-total" class="text-xl font-black text-orange-600">0 ₸</span>
                    </div>

                    <!-- Форма заказа -->
                    <form onsubmit="submitOrder(event)" class="space-y-3">
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-0.5">ФИО / Студент</label>
                            <input type="text" id="student-name" required placeholder="Напр: Аиша" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-orange-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-0.5">Номер группы / ID</label>
                            <input type="text" id="student-id" required placeholder="Напр: ИС-21" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-orange-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-0.5">Время самовывоза</label>
                            <select id="pickup-time" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-orange-500 focus:outline-none">
                                <option value="После 1-й пары (10:00 - 10:10)">После 1-й пары (10:00 - 10:10)</option>
                                <option value="Большая перемена (11:40 - 12:10)">Большая перемена (11:40 - 12:10)</option>
                                <option value="После 3-й пары (13:40 - 13:55)">После 3-й пары (13:40 - 13:55)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-0.5">Способ оплаты</label>
                            <select id="payment-method" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2 text-sm focus:ring-2 focus:ring-orange-500 focus:outline-none">
                                <option value="Kaspi QR">Kaspi QR (Оплата по QR)</option>
                                <option value="Наличные в кассе">Наличные в кассе</option>
                            </select>
                        </div>

                        <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl transition cursor-pointer shadow-lg shadow-orange-600/20 text-sm">
                            Оформить заказ
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </main>

    <script>
        let allDishes = [];
        let cart = [];

        // Строгий порядок вывода категорий на экран
        const categoryOrder = ["Первые блюда", "Вторые блюда", "Выпечка", "Напитки"];

        // Загрузка блюд с сервера и группировка по категориям
        async function loadDishes() {
            const res = await fetch('/api/dishes');
            allDishes = await res.json();
            const container = document.getElementById('menu-categories-container');
            document.getElementById('dishes-count').innerText = `${allDishes.length} блюд`;

            if (allDishes.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center py-8">Меню пока пусто</p>';
                return;
            }

            // Группируем блюда по категориям
            const grouped = {};
            allDishes.forEach(d => {
                const cat = d.category || "Другое";
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(d);
            });

            // Формируем HTML для каждой категории в заданном порядке
            let htmlContent = '';
            
            categoryOrder.forEach(catName => {
                if (grouped[catName] && grouped[catName].length > 0) {
                    htmlContent += `
                        <div class="space-y-4">
                            <h3 class="text-lg font-bold text-gray-900 border-b border-gray-200 pb-2 flex items-center gap-2">
                                ${getCategoryEmoji(catName)} ${catName}
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                ${grouped[catName].map(d => `
                                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                                        <div>
                                            <img src="${d.image}" alt="${d.title}" class="w-full h-40 object-cover">
                                            <div class="p-4">
                                                <h4 class="font-bold text-gray-900 text-base">${d.title}</h4>
                                            </div>
                                        </div>
                                        <div class="p-4 pt-0 flex justify-between items-center">
                                            <span class="font-black text-lg text-gray-900">${d.price} ₸</span>
                                            <button onclick="addToCart(${d.id})" class="bg-orange-50 hover:bg-orange-600 text-orange-600 hover:text-white font-bold px-4 py-2 rounded-xl text-sm transition cursor-pointer">
                                                Добавить
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            });

            container.innerHTML = htmlContent;
        }

        // Вспомогательная функция для красивых эмодзи у категорий
        function getCategoryEmoji(category) {
            if (category.includes('Первые')) return '🥣';
            if (category.includes('Вторые')) return '🍲';
            if (category.includes('Выпечка')) return '🥐';
            if (category.includes('Напитки')) return '🧃';
            return '🍽️';
        }

        // Добавление в корзину
        function addToCart(id) {
            const dish = allDishes.find(d => d.id === id);
            if (dish) {
                cart.push({ title: dish.title, price: dish.price });
                updateCartUI();
            }
        }

        // Удаление конкретного товара из корзины по индексу
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        // Обновление интерфейса корзины
        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const totalContainer = document.getElementById('cart-total');

            if (cart.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">Корзина пуста</p>';
                totalContainer.innerText = '0 ₸';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                    <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-xl border border-gray-200 gap-2">
                        <span class="text-sm text-gray-800 font-medium truncate">${item.title}</span>
                        <div class="flex items-center gap-2 shrink-0">
                            <span class="text-sm font-bold text-gray-900">${item.price} ₸</span>
                            <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 hover:bg-red-50 font-bold w-6 h-6 rounded-lg flex items-center justify-center transition cursor-pointer" title="Удалить">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalContainer.innerText = `${total} ₸`;
        }

        // Отправка заказа на сервер
        async function submitOrder(e) {
            e.preventDefault();
            if (cart.length === 0) {
                alert('Добавьте хотя бы одно блюдо в корзину!');
                return;
            }

            const student_name = document.getElementById('student-name').value;
            const student_id = document.getElementById('student-id').value;
            const pickup_time = document.getElementById('pickup-time').value;
            const payment_method = document.getElementById('payment-method').value;

            const res = await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_name,
                    student_id,
                    pickup_time,
                    payment_method,
                    items: cart
                })
            });

            const data = await res.json();
            if (data.success) {
                alert('Заказ успешно оформлен! Ожидайте готовности.');
                cart = [];
                updateCartUI();
                document.getElementById('student-name').value = '';
                document.getElementById('student-id').value = '';
            } else {
                alert('Ошибка при оформлении заказа');
            }
        }

        loadDishes();
    </script>
</body>
</html>
