<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusEats — Столовая колледжа</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-16">

    <!-- Навигационная панель -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-orange-500 text-white p-2 rounded-lg font-bold text-lg">🍽️</div>
                <h1 class="text-xl font-bold text-gray-900">CampusEats</h1>
            </div>
            <div class="flex space-x-4">
                <a href="/cashier" class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-4 py-2 rounded-lg font-medium text-sm transition">Касса ↗</a>
                <a href="/admin" class="bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-lg font-medium text-sm transition">Админка ↗</a>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Левая колонка: Меню по категориям -->
        <div class="lg:col-span-2">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-extrabold text-gray-900">Меню столовой</h2>
                <span id="dishes-count" class="text-xs bg-orange-100 text-orange-700 font-bold px-3 py-1 rounded-full">Загрузка...</span>
            </div>

            <!-- Контейнер для категорий и блюд (заполняется через JS из API) -->
            <div id="menu-categories-container" class="space-y-8">
                <p class="text-gray-500">Загрузка меню...</p>
            </div>
        </div>

        <!-- Правая колонка: Корзина и оформление заказа -->
        <div class="bg-white rounded-3xl shadow-xl border border-gray-100 p-6 sticky top-24 flex flex-col h-fit">
            <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                🛒 Ваша корзина
            </h2>
            
            <!-- Список товаров в корзине -->
            <div id="cart-items" class="divide-y divide-gray-100 max-h-60 overflow-y-auto mb-4">
                <p class="text-sm text-gray-400 py-2">Корзина пуста</p>
            </div>

            <div class="border-t border-gray-100 pt-4 mb-6">
                <div class="flex justify-between items-center text-lg font-bold">
                    <span>Итого к оплате:</span>
                    <span id="cart-total" class="text-orange-600">0 ₸</span>
                </div>
            </div>

            <!-- Форма заказа -->
            <form onsubmit="submitOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">ФИО / Студент</label>
                    <input type="text" id="student-name" required placeholder="Введите ваше имя" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Номер группы / ID</label>
                    <input type="text" id="student-id" required placeholder="Например: П-25-756" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Время самовывоза</label>
                    <select id="pickup-time" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:border-orange-500">
                        <option>Большая перемена (11:40 - 12:10)</option>
                        <option>Малая перемена (10:00 - 10:10)</option>
                        <option>После пар (13:50)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Способ оплаты</label>
                    <select id="payment-method" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:border-orange-500">
                        <option>Kaspi QR (Оплата по QR)</option>
                        <option>Наличными на кассе</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-orange-500/20">
                    Оформить заказ
                </button>
            </form>
        </div>

    </main>

    <!-- Скрипты загрузки меню и отправки заказов -->
    <script>
        let cart = [];
        let allDishes = [];

        // Загружаем блюда с бэкенда при открытии страницы
        async function loadMenu() {
            try {
                const res = await fetch('/api/dishes');
                allDishes = await res.json();
                renderMenu(allDishes);
            } catch (err) {
                console.error('Ошибка загрузки меню:', err);
                document.getElementById('menu-categories-container').innerHTML = '<p class="text-red-500">Не удалось загрузить меню.</p>';
            }
        }

        // Отрисовка меню по категориям
        function renderMenu(dishes) {
            const container = document.getElementById('menu-categories-container');
            const countEl = document.getElementById('dishes-count');
            countEl.innerText = `Блюд: ${dishes.length}`;
            
            if (dishes.length === 0) {
                container.innerHTML = '<p class="text-gray-500">Меню пока пусто</p>';
                return;
            }

            // Группируем по категориям
            const categories = {};
            dishes.forEach(dish => {
                if (!categories[dish.category]) {
                    categories[dish.category] = [];
                }
                categories[dish.category].push(dish);
            });

            container.innerHTML = '';

            for (const [category, items] of Object.entries(categories)) {
                const catDiv = document.createElement('div');
                catDiv.innerHTML = `
                    <h3 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b border-gray-200">${category}</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${items.map(dish => `
                            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                                <img src="${dish.image}" alt="${dish.title}" class="w-full h-40 object-cover">
                                <div class="p-4">
                                    <h4 class="font-bold text-gray-900">${dish.title}</h4>
                                    <div class="flex justify-between items-center mt-3">
                                        <span class="font-bold text-orange-600">${dish.price} ₸</span>
                                        <button onclick="addToCart(${dish.id}, '${dish.title.replace(/'/g, "\\'")}', ${dish.price})" class="bg-orange-500 hover:bg-orange-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition">
                                            Добавить
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(catDiv);
            }
        }

        function addToCart(id, title, price) {
            cart.push({ id, title, price });
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const cartContainer = document.getElementById('cart-items');
            const totalContainer = document.getElementById('cart-total');
            if (!cartContainer || !totalContainer) return;

            if (cart.length === 0) {
                cartContainer.innerHTML = '<p class="text-sm text-gray-400 py-2">Корзина пуста</p>';
                totalContainer.innerText = '0 ₸';
                return;
            }

            cartContainer.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center py-2 text-sm';
                div.innerHTML = `
                    <span>${item.title}</span>
                    <div class="flex items-center space-x-2">
                        <span class="font-medium">${item.price} ₸</span>
                        <button type="button" onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 font-bold px-1">×</button>
                    </div>
                `;
                cartContainer.appendChild(div);
            });

            totalContainer.innerText = total + ' ₸';
        }

        // Отправка заказа на сервер
        async function submitOrder(event) {
            event.preventDefault();
            
            if (cart.length === 0) {
                alert('Добавьте хотя бы одно блюдо в корзину!');
                return;
            }

            const student_name = document.getElementById('student-name').value;
            const group_id = document.getElementById('student-id').value;
            const pickup_time = document.getElementById('pickup-time').value;
            const payment_method = document.getElementById('payment-method').value;
            const total_price = cart.reduce((sum, item) => sum + item.price, 0);

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_name,
                        group_id,
                        pickup_time,
                        payment_method,
                        total_price,
                        items: JSON.stringify(cart)
                    })
                });
                
                const result = await res.json();
                if (result.success) {
                    alert('Заказ успешно оформлен! Номер заказа: #' + result.order_id);
                    cart = [];
                    updateCartUI();
                    document.getElementById('student-name').value = '';
                    document.getElementById('student-id').value = '';
                } else {
                    alert('Ошибка при оформлении заказа: ' + (result.error || 'неизвестная ошибка'));
                }
            } catch (error) {
                console.error('Ошибка сети:', error);
                alert('Не удалось отправить заказ на сервер.');
            }
        }

        // Запускаем загрузку меню при загрузке страницы
        loadMenu();
    </script>
</body>
</html>
